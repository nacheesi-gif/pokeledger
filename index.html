function initial(){return {version:2,budget:200,budgets:{hobby:200,resale:0},members:['Me','Kid 1','Kid 2','Family'],cards:[],transactions:[],statuses:{},notes:{}}}
function load(){try{const old=JSON.parse(localStorage.getItem(KEY))||{};return normalizeData(old)}catch{return initial()}}
function normalizeData(old){if(!old||!Array.isArray(old.cards)||!Array.isArray(old.transactions)||!Array.isArray(old.members)||!old.statuses||typeof old.statuses!=='object')return initial();let b=old.budgets&&typeof old.budgets==='object'?old.budgets:{hobby:Number(old.budget)||200,resale:0};return {...initial(),...old,version:2,budgets:{hobby:Number(b.hobby)||0,resale:Number(b.resale)||0}}}

function allCards(){return [...SEED,...db.cards]}
function ownedCards(){return allCards().filter(c=>['Owned','Grading'].includes(db.statuses[c.id]?.state))}

function txSum(pred){return db.transactions.filter(pred).reduce((a,t)=>a+(+t.amount||0),0)}
const purchase=t=>t.kind==='purchase'; const sale=t=>t.kind==='sale'; const cashout=t=>t.kind==='cashout';
function valuedInventory(){let cost=0,value=0,count=0,missing=0;for(const card of ownedCards()){const row=db.statuses[card.id]||{},qty=Number(row.qty)||0;if(qty<=0)continue;const ac=row.unitCost===null||row.unitCost===undefined||row.unitCost===''?NaN:Number(row.unitCost),mv=row.marketUnitValue===null||row.marketUnitValue===undefined||row.marketUnitValue===''?NaN:Number(row.marketUnitValue);if(!Number.isFinite(ac)||!Number.isFinite(mv)||ac<0||mv<0){missing+=qty;continue}count+=qty;cost+=ac*qty;value+=mv*qty;}return {gain:value-cost,cost,value,count,missing};}
function metrics(){const valued=valuedInventory(),spent=txSum(purchase),gross=txSum(sale), saleCosts=db.transactions.filter(sale).reduce((a,t)=>a+(+t.fees||0)+(+t.shipping||0),0),netSales=gross-saleCosts;
 const month=today().slice(0,7),monthly=txSum(t=>purchase(t)&&t.date.slice(0,7)===month);
 const hobbySpent=txSum(t=>purchase(t)&&t.purpose!=='Resale inventory'),resaleSpent=txSum(t=>purchase(t)&&t.purpose==='Resale inventory');
 const hobbyMonth=txSum(t=>purchase(t)&&t.date.slice(0,7)===month&&t.purpose!=='Resale inventory');
 const resaleMonth=txSum(t=>purchase(t)&&t.date.slice(0,7)===month&&t.purpose==='Resale inventory');
 const knownSales=db.transactions.filter(t=>sale(t)&&t.costBasis!==null&&t.costBasis!==undefined&&t.costBasis!=='');
 const unknownSales=db.transactions.filter(t=>sale(t)&&(t.costBasis===null||t.costBasis===undefined||t.costBasis===''));
 const realized=knownSales.reduce((a,t)=>a+(+t.amount||0)-(+t.fees||0)-(+t.shipping||0)-(+t.costBasis||0),0);
 const cashoutNet=txSum(cashout),cashoutGross=db.transactions.filter(cashout).reduce((a,t)=>a+(Number(t.grossAmount)||Number(t.amount)||0),0),cashoutFees=db.transactions.filter(cashout).reduce((a,t)=>a+(Number(t.fees)||0),0);
 return {spent,gross,netSales,monthly,realized,valued,unknownSales:unknownSales.length,knownSales:knownSales.length,netOut:spent-netSales,hobbySpent,resaleSpent,cashoutNet,cashoutGross,cashoutFees,cashoutCount:db.transactions.filter(cashout).length,hobbyMonth,resaleMonth,owned:ownedCards().length}}
async function refreshRawOwnedPrices(button){const statusNode=document.getElementById("pl-refresh-note");const eligible=ownedCards().filter(c=>c.tcgdexId&&['NM','Unknown'].includes(db.statuses[c.id]?.condition||'NM'));if(!eligible.length){if(statusNode)statusNode.textContent='No eligible identified Near Mint raw cards yet.';return}if(button)button.disabled=true;if(statusNode)statusNode.textContent='Checking raw market snapshots for '+Math.min(eligible.length,35)+' cards…';let updated=0,skipped=0;for(const c of eligible.slice(0,35)){try{const d=await window.PokeMarket.load(c.tcgdexId),t=d.pricing?.tcgplayer||{};const stamp=t.updated?new Date(typeof t.updated==='number'?t.updated*(t.updated>1e11?1:1000):t.updated):null;if(!stamp||!Number.isFinite(stamp.getTime())||Date.now()-stamp.getTime()>7*86400000){skipped++;continue}const options=Object.entries(t).filter(([k,v])=>['normal','holofoil','reverse-holofoil'].includes(k.toLowerCase())&&v&&typeof v.marketPrice==='number'&&Number.isFinite(v.marketPrice)&&v.marketPrice>=0);if(options.length!==1){skipped++;continue}const [variant,data]=options[0],row=db.statuses[c.id]||{};row.marketUnitValue=data.marketPrice;row.marketSource='TCGplayer via TCGdex ('+variant+')';row.marketAsOf=stamp.toISOString().slice(0,10);db.statuses[c.id]=row;updated++}catch{skipped++}}if(updated)save();const el=document.getElementById('pl-refresh-note');if(el)el.textContent=updated+' updated · '+skipped+' skipped (missing, stale, or ambiguous prices). Verify the exact card finish and condition.';if(button)button.disabled=false;}

function txHTML(t,buttons=true){let isBuy=purchase(t),isCash=cashout(t);return `<div class="item" style="margin-bottom:7px"><div class="row"><div><b>${esc(t.title)}</b><div><small>${esc(t.date)} · ${esc(t.owner||'Me')} · ${esc(t.type||'Other Pokémon')} ${isBuy?'· '+esc(t.purpose||'Hobby / family'):''} ${t.merchant?'· '+esc(t.merchant):''} ${t.cardId?'· linked card':''}</small></div>${t.receipt?`<small><a class="link" target="_blank" rel="noopener noreferrer" href="${esc(t.receipt)}">Receipt / order</a></small>`:''}</div><div style="text-align:right"><div class="amount ${isBuy?'negative':'positive'}">${isBuy?'−':'+'}${money(t.amount)}</div>${isCash?`<small>Gross withdrawal ${money(t.grossAmount ?? t.amount)} · fees ${money(t.fees||0)} · received ${money(t.amount)}</small>`:(!isBuy?`<small>fees ${money(t.fees||0)} · cost ${t.costBasis===null||t.costBasis===undefined||t.costBasis===''?'unknown':money(t.costBasis)}</small>`:'')}${buttons?`<div><button class="btn sm danger" onclick="deleteTx('${esc(t.id)}')">Delete</button></div>`:''}</div></div>${isBuy&&Array.isArray(t.haulCards)&&t.haulCards.length?`<details class="pk-haul-details"><summary>${t.haulCards.length} card entries · Show card costs and values</summary><div class="pk-haul-history">${t.haulCards.map(c=>`<div class="pk-haul-history-line"><span>${esc(c.name)} · ${esc(c.set||"")} ${esc(c.number||"")} · Qty ${esc(c.qty||1)}</span><span>Paid ${money((Number(c.unitCost)||0)*(Number(c.qty)||1))} · Market ${c.marketUnitValue==null?"not entered":money((Number(c.marketUnitValue)||0)*(Number(c.qty)||1))}</span></div>`).join("")}</div></details>`:""}</div>`}
function spending(){let list=[...db.transactions].filter(purchase).sort((a,b)=>b.date.localeCompare(a.date));let byType=types.map(x=>[x,txSum(t=>purchase(t)&&t.type===x)]).filter(x=>x[1]>0);let max=Math.max(1,...byType.map(x=>x[1]));let m=metrics();return `<div class="sectionHead"><div><h1>Pokémon spending</h1><p class="muted">Family purchases separate from resale stock</p></div>${btn('+ Purchase','openPurchase()','primary')}</div><div class="metrics"><div class="metric"><small>All purchases</small><b>${money(m.spent)}</b></div><div class="metric"><small>Family / hobby</small><b>${money(m.hobbySpent)}</b></div><div class="metric"><small>Resale inventory</small><b>${money(m.resaleSpent)}</b></div><div class="metric"><small>This month</small><b>${money(m.monthly)}</b></div></div><div class="split"><div class="panel"><div class="panelTitle"><h2>Where the money goes</h2></div>${byType.length?byType.map(([k,v])=>`<div class="chartLine"><span>${esc(k)}</span><div class="progress"><div style="width:${v/max*100}%"></div></div><b>${money(v)}</b></div>`).join(''):'<div class="empty">Purchases appear here after you log them.</div>'}</div><div class="panel"><div class="panelTitle"><h2>By family profile</h2></div>${db.members.map(m=>`<div class="row" style="margin:12px 0"><span>${esc(m)}</span><b>${money(txSum(t=>purchase(t)&&t.owner===m))}</b></div>`).join('')}</div></div><div class="panel"><div class="panelTitle"><h2>Purchase history</h2><small>${list.length} entries</small></div>${list.length?list.map(t=>txHTML(t)).join(''):'<div class="empty">No purchases yet.</div>'}</div>`}
function sales(){const list=[...db.transactions].filter(sale).sort((a,b)=>b.date.localeCompare(a.date)),cashouts=[...db.transactions].filter(cashout).sort((a,b)=>b.date.localeCompare(a.date)),m=metrics();return `<div class="sectionHead"><div><h1>Sales & cashouts</h1><p class="muted">Keep platform withdrawals separate from individual card sales and their profit</p></div><div class="controls">${btn('+ Record sale','openSale()','primary')}${btn('+ Log cashout','openCashout()','')}</div></div><div class="metrics"><div class="metric"><small>Gross sales</small><b>${money(m.gross)}</b></div><div class="metric"><small>Net sale proceeds</small><b>${money(m.netSales)}</b></div><div class="metric"><small>Known realized sale P/L</small><b class="${m.realized<0?'negative':'positive'}">${money(m.realized)}</b><div class="hint">${m.knownSales} sales with known item costs · ${m.unknownSales} missing</div></div><div class="metric"><small>Platform cashouts received</small><b>${money(m.cashoutNet)}</b><div class="hint">${m.cashoutCount} withdrawals, not counted as card-sale profits</div></div></div><div class="split"><div class="panel"><div class="panelTitle"><h2>Platform withdrawals</h2>${btn('+ Cashout','openCashout()','sm')}</div><div class="row" style="margin-bottom:8px"><span class="muted">Gross requested</span><b>${money(m.cashoutGross)}</b></div><div class="row" style="margin-bottom:8px"><span class="muted">Payout fees / differences</span><b>${money(m.cashoutFees)}</b></div><div class="row"><span class="muted">Actually received</span><b class="positive">${money(m.cashoutNet)}</b></div><p class="mutedLine" style="margin-top:12px">Example: LastPack withdrawal $100, PayPal received $94, fees $6. A cashout is a transfer of platform funds, not an additional card sale.</p></div><div class="panel"><div class="panelTitle"><h2>Cashout history</h2><small>${cashouts.length} recorded</small></div>${cashouts.length?cashouts.map(t=>txHTML(t)).join(''):'<div class="empty">Log your first LastPack or other platform withdrawal here.</div>'}</div></div><div class="notice"><b>Accounting:</b> Withdrawals are excluded from verified card-sale profit to avoid double counting money already recorded as a sale. Purchases remain in spending; this view separately tracks money moving from platforms to you. <b>Sale profit</b> = sale price − sale fees − seller shipping − item cost.</div><div class="panel"><div class="panelTitle"><h2>Card / product sales</h2></div>${list.length?list.map(t=>txHTML(t)).join(''):'<div class="empty">Your first recorded sale will appear here.</div>'}</div>`}
function settings(){return `<div class="sectionHead"><div><h1>Settings & backups</h1><p class="muted">Save a backup to your phone; cloud comes later</p></div></div>${window.PokeCollections.settingsPanel()}<div class="panel"><div class="panelTitle"><h2>Cloud sync</h2><span class="pill ${cloudState==='ready'?'good':'blue'}">${esc(cloudState==='ready'?'Connected':cloudState==='local'?'Local only':cloudState)}</span></div><p class="mutedLine" id="cloudStatus">${esc(cloudStatus)}</p>${cloudPanel()}</div><div class="panel"><h2>Household profiles & budgets</h2><p class="mutedLine">Profiles distinguish family members. Budgets separate hobby spending from resale stock.</p><div class="row wrap">${db.members.map(m=>`<span class="pill blue">${esc(m)}</span>`).join('')}</div><div style="margin-top:14px">${btn('Add family profile','addMember()','sm')} ${btn('Edit monthly budgets','editBudget()','sm')}</div></div><div class="panel"><h2>Independent backups</h2><p class="mutedLine">Export full JSON to iCloud Drive or another safe location. CSV is for spreadsheets. Back up before switching hosting URLs, phones, or restoring cloud copies.</p><div class="controls">${btn('Export full backup JSON','exportJSON()','primary sm')}${btn('Export transactions CSV','exportCSV()','sm')}${btn('Import backup JSON','importDialog()','sm')}</div></div><div class="panel"><h2>About price data</h2><p class="mutedLine">The 120 Trainer Gallery scans are catalog references. TCGplayer raw market snapshots can be checked through card details when available. Graded sold prices require verification through the external source links. Sales profit uses amounts you enter, not speculative card value.</p></div><div class="panel"><h2>Data management</h2><p class="mutedLine">Clearing local records while cloud is connected will also sync that empty state. Export a JSON backup first.</p>${btn('Reset all personal records','resetData()','danger sm')}</div>`}

function openCashout(){show(`<h2>Log a platform cashout</h2><p class="mutedLine">Track withdrawals from LastPack or another Pokémon platform. Enter what you requested and what actually arrived; the difference is the payout fee.</p><form onsubmit="event.preventDefault();submitCashout(this)"><div class="formGrid"><label>Platform / app<input class="field" name="merchant" value="LastPack" required placeholder="LastPack, Whatnot, Courtyard"></label><label>Cashout date<input class="field" name="date" type="date" value="${today()}" required></label><label>Withdrawal requested ($)<input class="field" name="grossAmount" type="number" min="0.01" step="0.01" placeholder="100.00" required></label><label>Amount actually received ($)<input class="field" name="amount" type="number" min="0" step="0.01" placeholder="94.00" required></label><label>Received through<input class="field" name="destination" placeholder="PayPal, bank, etc."></label><label>Who received it?<select name="owner" class="field">${opts(db.members,'Me')}</select></label><label class="span2">Notes (optional)<textarea class="field" name="notes" rows="2" placeholder="Payout ID, processing fee, payout details"></textarea></label></div><div class="notice" style="margin-top:10px">Cashouts are tracked separately from card-sale revenue and profit. Record the amount that actually reached your PayPal or bank account.</div><div class="modalFoot">${btn('Cancel','closeModal()')}<button class="btn primary" type="submit">Save cashout</button></div></form>`)}
function submitCashout(f){const o=Object.fromEntries(new FormData(f));const gross=Number(o.grossAmount),net=Number(o.amount);if(!o.merchant.trim()||!Number.isFinite(gross)||!Number.isFinite(net)||gross<=0||net<0||net>gross)return alert('Check requested and received amounts. Received cannot exceed requested.');const fees=+(gross-net).toFixed(2);const duplicate=db.transactions.some(t=>cashout(t)&&t.date===o.date&&String(t.merchant||'').toLowerCase()===o.merchant.trim().toLowerCase()&&Math.abs(Number(t.amount)-net)<0.005&&Math.abs(Number(t.grossAmount)-gross)<0.005);if(duplicate&&!confirm('A matching cashout already exists on this date. Save another?'))return;db.transactions.push({...o,merchant:o.merchant.trim(),amount:net,grossAmount:gross,fees,id:uid(),kind:'cashout',title:o.merchant.trim()+' cashout',type:'Platform cashout',purpose:'Transfer'});closeModal();save();page='sales';render()}
function updateSaleCost(f,pick){const c=getCard(f.elements.cardId.value),st=c?db.statuses[c.id]:null,q=Number(f.elements.quantity.value)||1,n=document.getElementById('sale-cost-note');if(!c){if(n)n.textContent='Manual sale: enter card cost yourself if known.';return;}if(pick)f.elements.title.value=c.name;const available=Number(st?.qty)||0;if(!st||!['Owned','Grading'].includes(st.state)||q>available){f.elements.costBasis.value='';if(n)n.textContent='You have '+available+' available copies. Select a valid quantity.';return;}if(st.unitCost===null||st.unitCost===undefined||st.unitCost===''){f.elements.costBasis.value='';if(n)n.textContent='Acquisition cost unknown; enter it manually if known.';return;}f.elements.costBasis.value=(Math.round(Number(st.unitCost)*q*100)/100).toFixed(2);if(n)n.textContent='Automatically calculated cost for '+q+' cards from recorded hauls.';}
function openSale(){show(`<h2>Record a sale</h2><p class="mutedLine">Link a card you own to automatically use its recorded haul cost. Leave cost blank if unknown.</p><form onsubmit="event.preventDefault();submitSale(this)"><div class="formGrid"><label class="span2">Item sold<input class="field" name="title" required placeholder="e.g. Kadabra card"></label><label>Quantity sold<input class="field" name="quantity" type="number" min="1" step="1" value="1" required oninput="updateSaleCost(this.form)"></label><label>Sale price (USD)<input class="field" name="amount" type="number" min="0" step="0.01" required></label><label>Date<input class="field" name="date" type="date" value="${today()}" required></label><label>Platform fees<input class="field" name="fees" type="number" value="0" min="0" step="0.01" required></label><label>Seller shipping<input class="field" name="shipping" type="number" value="0" min="0" step="0.01" required></label><label>Card cost basis · auto for linked cards<input class="field" name="costBasis" type="number" placeholder="Blank if unknown" min="0" step="0.01"></label><label>From whose collection?<select name="owner" class="field">${opts(db.members,'Me')}</select></label><label class="span2">Linked catalog card<select class="field" name="cardId" onchange="updateSaleCost(this.form,true)">${cardOptions()}</select></label></div><p class="mutedLine" id="sale-cost-note">Select an owned card to calculate the cost automatically.</p><div class="modalFoot">${btn('Cancel','closeModal()')}<button class="btn primary" type="submit">Save sale</button></div></form>`)}
function submitSale(f){let o=Object.fromEntries(new FormData(f));for(let k of ['amount','fees','shipping','quantity'])o[k]=+o[k];o.costBasis=o.costBasis===''?null:Number(o.costBasis);if(!Number.isInteger(o.quantity)||o.quantity<1||Object.values(o).some(x=>typeof x==='number'&&(!Number.isFinite(x)||x<0)))return alert('Enter valid amounts.');if(o.cardId){const c=getCard(o.cardId),st=c?db.statuses[c.id]:null;const available=Number(st?.qty)||0;if(!st||!['Owned','Grading'].includes(st.state)||o.quantity>available)return alert('Not enough copies owned. Choose an owned card or use a manual sale.');if(st.unitCost!==null&&st.unitCost!==undefined&&st.unitCost!==''&&Number.isFinite(Number(st.unitCost)))o.costBasis=Math.round(Number(st.unitCost)*o.quantity*100)/100;const left=available-o.quantity;db.statuses[c.id]={...st,qty:left,state:left>0?st.state:'Not tracked'};o.inventoryDeducted=true;}db.transactions.push({...o,id:uid(),kind:'sale',type:'Card / product sale'});closeModal();save()}

function openInventory(id){let c=getCard(id),s=status(id);show(`<h2>${esc(c.name)}</h2><p class="mutedLine">${esc(c.set)} · ${esc(c.number)} · ${esc(c.category)}</p><form onsubmit="event.preventDefault();submitInventory(this,'${esc(id)}')"><div class="formGrid"><label>Status<select class="field" name="state">${opts(['Not tracked','Owned','Wishlist','Grading'],s.state)}</select></label><label>Belongs to<select class="field" name="owner">${opts(db.members,s.owner)}</select></label><label>Quantity owned<input class="field" type="number" min="0" step="1" name="qty" value="${esc(s.qty)}"></label><label>Condition<select class="field" name="condition">${opts(['NM','LP','MP','HP','DMG','Sealed','PSA 10','PSA 9','Graded other','Unknown'],s.condition)}</select></label><label>Acquisition cost per copy ($)<input class="field" name="unitCost" type="number" min="0" step="0.01" value="${esc(s.unitCost??'')}" placeholder="0.00 for giveaway"></label><label>Market value per copy ($)<input class="field" name="marketUnitValue" type="number" min="0" step="0.01" value="${esc(s.marketUnitValue??'')}" placeholder="Verify value for this condition"></label><label>Market value date<input class="field" name="marketAsOf" type="date" value="${esc(s.marketAsOf??'')}"></label><label>Price source<input class="field" name="marketSource" value="${esc(s.marketSource??'')}" placeholder="TCGplayer, eBay sold, PSA..."></label><label class="span2">Notes<textarea class="field" name="notes" rows="3" placeholder="Condition, date acquired, grading notes">${esc(db.notes[id]||'')}</textarea></label></div><div class="modalFoot">${btn('Cancel','closeModal()')}<button class="btn primary" type="submit">Save card</button></div></form>`)}

function addMember(){let x=prompt('Name of collection profile (e.g. Maz):');if(!x)return;x=x.trim();if(db.members.some(y=>y.toLowerCase()===x.toLowerCase()))return alert('Profile already exists');db.members.push(x);save()}
function deleteTx(id){if(confirm('Remove this transaction permanently?')){db.transactions=db.transactions.filter(t=>t.id!==id);save()}}
function resetData(){if(prompt('Type RESET to delete all personal purchases, sales and collection status:')!=='RESET')return;db=initial();save()}
function download(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){download('pokeledger-v2-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function exportCSV(){let keys=['kind','date','title','amount','grossAmount','purpose','owner','type','merchant','destination','receipt','fees','shipping','costBasis','cardId','notes'];let content=[keys.join(','),...db.transactions.map(t=>keys.map(k=>csvCell(t[k])).join(','))].join('\n');download('pokeledger-transactions-'+today()+'.csv',content,'text/csv')}
function importDialog(){show(`<h2>Import backup</h2><div class="notice">Import replaces all current personal records. Export a backup first if you want to preserve them.</div><input class="field" type="file" id="fileInput" accept=".json,application/json"><div class="modalFoot">${btn('Cancel','closeModal()')}${btn('Import','doImport()','primary')}</div>`)}
async function doImport(){let f=document.getElementById('fileInput').files[0];if(!f)return alert('Choose a JSON backup.');try{let j=JSON.parse(await f.text());if(!Array.isArray(j.cards)||!Array.isArray(j.transactions)||!Array.isArray(j.members)||typeof j.statuses!=='object')throw Error('Not a valid PokéLedger backup');if(!confirm('Replace current records with this backup?'))return;db=normalizeData(j);closeModal();save()}catch(e){alert('Import failed: '+e.message)}}

// Cloud sync: explicit setup, email OTP, owner-scoped RLS, revision checks, local-first data.
function cloudPanel(){if(!cloudCfg)return `<div class="notice">To activate syncing, first publish this app on an HTTPS site and create your private Supabase project. You'll enter your project URL and publishable key here — never a secret or service-role key.</div><form onsubmit="event.preventDefault();configureCloud(this)"><div class="formGrid"><label class="span2">Supabase project URL<input class="field" type="url" name="url" required placeholder="https://YOURPROJECT.supabase.co"></label><label class="span2">Publishable / anon key<input class="field" name="key" required placeholder="sb_publishable_..."></label></div><div class="modalFoot"><button class="btn primary" type="submit">Connect cloud project</button></div></form>`;
 if(!cloudSession||!cloudSession.refresh_token)return `<div class="notice">Cloud project connected. Sign in with an email code. Data still stays on this device until sign-in succeeds.</div><form onsubmit="event.preventDefault();sendCloudCode(this)"><div class="formGrid"><label class="span2">Email address<input class="field" type="email" name="email" required placeholder="you@example.com"></label></div><div class="modalFoot"><button class="btn primary" type="submit">Email me a sign-in code</button></div></form><form onsubmit="event.preventDefault();verifyCloudCode(this)"><div class="formGrid"><label>Email used above<input class="field" type="email" name="email" required value="${esc(window.lastCloudEmail||'')}"></label><label>One-time code<input class="field" name="token" inputmode="numeric" autocomplete="one-time-code" required placeholder="Code from email"></label></div><div class="modalFoot"><button class="btn" type="submit">Verify code & sign in</button></div></form>${btn('Change cloud project','disconnectCloud()','sm')}`;
 return `<div class="mutedLine">Signed in as <b>${esc(cloudSession.user?.email||'your account')}</b> ${cloudUpdatedAt?'· Last saved '+esc(cloudUpdatedAt):''}</div><div class="controls">${btn('Sync now','syncCloudNow()','primary sm')}${btn('Load cloud copy','confirmCloudLoad()','sm')}${btn('Keep this device / upload','confirmCloudOverwrite()','sm')}${btn('Sign out','signOutCloud()','sm')}</div><p class="mutedLine" style="margin-top:13px">Edits automatically sync after saving when connected. On conflict, nothing is overwritten automatically. Download a JSON backup before replacing a copy.</p>`}
function cloudSet(textValue,state){cloudStatus=textValue;if(state)cloudState=state;if(page==='settings')render()}
function configureCloud(form){let x=Object.fromEntries(new FormData(form));let url=String(x.url||'').trim().replace(/\/$/,'');let key=String(x.key||'').trim();if(!/^https:\/\/[a-z0-9.-]+$/i.test(url))return alert('Use a valid HTTPS Supabase project URL.');if(!key||key.startsWith('sb_secret_')||key.startsWith('sb_service_'))return alert('Use only a public publishable / anon key, not a secret key.');cloudCfg={url,key};localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(cloudCfg));cloudSet('Project configured. Sign in with your email code.','disconnected')}
function disconnectCloud(){if(!confirm('Disconnect this device from the current cloud project? Local records will remain.'))return;localStorage.removeItem(CLOUD_CONFIG_KEY);localStorage.removeItem(CLOUD_SESSION_KEY);cloudCfg=null;cloudSession=null;cloudRevision=0;cloudPending=null;cloudSet('Local only — cloud disconnected','local')}
async function supaApi(path,options={}){if(!cloudCfg)throw Error('Configure cloud project first');const headers={'apikey':cloudCfg.key,'Content-Type':'application/json',...(options.headers||{})};const r=await fetch(cloudCfg.url+path,{...options,headers});const txt=await r.text();let data;try{data=txt?JSON.parse(txt):null}catch{data=txt}if(!r.ok)throw Error(data?.message||data?.msg||data?.error_description||data?.error||'Cloud request failed ('+r.status+')');return data}
async function sendCloudCode(form){const email=String(new FormData(form).get('email')||'').trim();window.lastCloudEmail=email;try{await supaApi('/auth/v1/otp',{method:'POST',body:JSON.stringify({email,create_user:true})});cloudSet('Check '+email+' for your one-time code.','disconnected')}catch(e){cloudSet('Email code could not be sent: '+e.message,'error')}}
async function verifyCloudCode(form){let x=Object.fromEntries(new FormData(form));try{let data=await supaApi('/auth/v1/verify',{method:'POST',body:JSON.stringify({email:String(x.email||'').trim(),token:String(x.token||'').trim(),type:'email'})});if(!data.access_token||!data.refresh_token)throw Error('No session was returned');cloudSession={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+1000*(data.expires_in||3600),user:data.user};localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(cloudSession));await initializeCloudSession()}catch(e){cloudSet('Could not verify code: '+e.message,'error')}}
async function ensureCloudAccess(){if(!cloudSession?.refresh_token)throw Error('Sign in to cloud first');if(cloudSession.expires_at>Date.now()+90000)return cloudSession.access_token;const data=await supaApi('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:cloudSession.refresh_token})});cloudSession={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+1000*(data.expires_in||3600),user:data.user||cloudSession.user};localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(cloudSession));return cloudSession.access_token}
async function cloudAuthRequest(path,options={}){const token=await ensureCloudAccess();return await supaApi(path,{...options,headers:{Authorization:'Bearer '+token,...(options.headers||{})}})}
function hasPersonalData(data){return !!(data.transactions?.length||data.cards?.length||Object.keys(data.statuses||{}).length||Object.keys(data.notes||{}).length||((data.members||[]).length>4))}
async function getCloudSnapshot(){let v=await cloudAuthRequest('/rest/v1/pokeledger_vault?select=data,revision,updated_at&limit=1',{method:'GET'});return v?.[0]||null}
async function initializeCloudSession(){if(!cloudCfg||!cloudSession)return;cloudSet('Checking your private cloud copy…','checking');try{await ensureCloudAccess();const remote=await getCloudSnapshot();cloudPending=remote;if(!remote){cloudRevision=0;cloudSet('Cloud account is empty; saving local records…','ready');await pushCloud();return}
 cloudRevision=Number(remote.revision)||0;cloudUpdatedAt=remote.updated_at?new Date(remote.updated_at).toLocaleString():'';
 if(JSON.stringify(db)===JSON.stringify(remote.data)||!hasPersonalData(db)){db=normalizeData(remote.data);persist();cloudPending=null;cloudSet('Your collection is synced to your account.','ready');return}
 cloudSet('Both this device and cloud have records. Choose which copy to keep; no data has been overwritten.','choice');chooseCloudCopy();
 }catch(e){cloudSet('Cloud sign-in needs attention: '+e.message,'error')}}
function chooseCloudCopy(){show(`<h2>Choose your starting copy</h2><p class="mutedLine">This phone and your cloud account contain different records. Nothing has been overwritten.</p><div class="notice">First export a full JSON backup if you want to preserve both copies. This first version syncs a complete snapshot rather than merging entries.</div><div class="controls">${btn('Export this phone backup','exportJSON()','sm')}${btn('Use existing cloud copy','useCloudCopy()','primary sm')}${btn('Upload this phone copy','confirmCloudOverwrite()','sm')}</div><div class="modalFoot">${btn('Decide later','closeModal()','sm')}</div>`)}
function useCloudCopy(){if(!cloudPending){return confirmCloudLoad()}if(!confirm('Replace local records with the cloud copy? Export a JSON backup first to keep both.'))return;db=normalizeData(cloudPending.data);persist();cloudRevision=Number(cloudPending.revision)||0;cloudPending=null;closeModal();cloudSet('Loaded cloud records. Auto-sync is on.','ready')}
async function confirmCloudLoad(){if(!cloudSession)return alert('Sign in first');if(!confirm('Load cloud data onto this device? Current local records will be replaced. Export a backup first.'))return;try{const remote=await getCloudSnapshot();if(!remote)return alert('Cloud has no saved copy yet.');db=normalizeData(remote.data);persist();cloudRevision=Number(remote.revision)||0;cloudPending=null;closeModal();cloudSet('Loaded latest cloud copy.','ready')}catch(e){cloudSet('Could not load cloud: '+e.message,'error')}}
async function confirmCloudOverwrite(){if(!cloudSession)return alert('Sign in first');if(!confirm('Replace the cloud copy with this device data? This may overwrite changes from another phone. Export backups first.'))return;try{let remote=await getCloudSnapshot();cloudRevision=remote?Number(remote.revision):0;cloudState='ready';await pushCloud();closeModal()}catch(e){cloudSet('Cloud upload failed: '+e.message,'error')}}
function scheduleCloudSave(){if(!cloudCfg||!cloudSession||cloudState!=='ready')return;cloudPendingChanges=true;if(cloudTimer)clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>{pushCloud().catch(()=>{})},850)}
async function pushCloud(){if(!cloudCfg||!cloudSession||cloudState!=='ready'||cloudSending)return;cloudSending=true;cloudPendingChanges=false;const snapshot=JSON.stringify(db);const expected=cloudRevision;cloudSet('Saving to private cloud…','ready');try{let response=await cloudAuthRequest('/rest/v1/rpc/save_pokeledger',{method:'POST',body:JSON.stringify({expected_revision:expected,new_data:JSON.parse(snapshot)})});let newrev=Array.isArray(response)?response[0]?.new_revision:response?.new_revision;if(!Number.isFinite(Number(newrev)))throw Error('Unexpected save response');cloudRevision=Number(newrev);cloudUpdatedAt=new Date().toLocaleString();cloudSet('Cloud saved. Your latest records are backed up online.','ready')}
 catch(e){cloudPendingChanges=true;const conflict=/conflict/i.test(e.message);cloudSet(conflict?'Another device changed the cloud copy. Choose which copy to keep in Settings.':'Local copy saved; cloud sync needs attention: '+e.message,conflict?'conflict':'offline')}
 finally{cloudSending=false;if(cloudPendingChanges&&cloudState==='ready')setTimeout(()=>pushCloud().catch(()=>{}),300)}}
async function syncCloudNow(){if(!cloudSession)return alert('Sign in first.');if(cloudState==='choice'||cloudState==='conflict')return chooseCloudCopyAfterConflict();try{const remote=await getCloudSnapshot();let rev=remote?Number(remote.revision):0;if(rev!==cloudRevision){cloudPending=remote;cloudSet('Cloud changed since your last save. Choose a copy.','choice');return chooseCloudCopyAfterConflict()}cloudState='ready';await pushCloud()}catch(e){cloudSet('Sync needs attention: '+e.message,'offline')}}
async function chooseCloudCopyAfterConflict(){try{cloudPending=await getCloudSnapshot();cloudSet('Select which copy to keep. Your edits are safe locally.','choice');chooseCloudCopy()}catch(e){cloudSet('Unable to compare cloud copies: '+e.message,'offline')}}
async function signOutCloud(){if(!confirm('Sign out of cloud on this device? Your local records remain available.'))return;try{if(cloudSession?.access_token)await cloudAuthRequest('/auth/v1/logout',{method:'POST'})}catch{}cloudSession=null;cloudRevision=0;localStorage.removeItem(CLOUD_SESSION_KEY);cloudSet('Signed out. Your device copy remains local.','disconnected')}
window.addEventListener('online',()=>{if(cloudState==='offline'&&cloudSession)syncCloudNow().catch(()=>{})});

window.addEventListener('storage',()=>{db=load();render()});render();if(cloudCfg&&cloudSession)initializeCloudSession().catch(e=>cloudSet(e.message,'error')); if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script></body></html>

name: Refresh Pokemon market prices
on:
  schedule:
    - cron: '43 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_prices.py'
      - '.github/workflows/prices.yml'
permissions:
  contents: read
concurrency:
  group: pokemon-price-cache
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update complete daily cache
        run: python3 scripts/sync_prices.py
      - name: Validate application and price fixtures
        run: |
          npm run check
          npm test
      - name: Commit public market data and request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- data/tcgplayer-prices; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/tcgplayer-prices
            git commit -m 'Refresh daily Pokemon market price cache'
            git push origin HEAD:main
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
